<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneLink PC Controller</title>
<style>
  [hidden] { display:none !important; }
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --text:#e8eaf0; --dim:#8b93a5; --accent:#4f8cff; --ok:#3ddc84; --bad:#ff5d5d; --wait:#ffb84d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--bad); flex:none; }
  .dot.wait { background:var(--wait); } .dot.on { background:var(--ok); }
  #statusText { flex:1; }
  button { font:inherit; color:var(--text); cursor:pointer; }
  .primary { background:var(--accent); border:0; border-radius:10px; padding:10px 16px; font-weight:600; }
  section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  h2 { margin:0 0 12px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .vol { display:grid; grid-template-columns:70px 1fr 44px; align-items:center; gap:10px; margin:10px 0; }
  .vol output { text-align:right; color:var(--dim); }
  input[type=range] { width:100%; height:32px; accent-color:var(--accent); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:#222631; border:1px solid var(--line); border-radius:14px; padding:18px 10px; font-size:17px; min-height:84px; }
  .card.on { background:var(--accent); border-color:var(--accent); }
  .card.pending { opacity:.55; }
  .ring { width:100%; background:#3a1d22; border:1px solid #6b2a33; border-radius:14px; padding:20px; font-size:18px; font-weight:600; }
  .ring.on { background:var(--bad); border-color:var(--bad); }
  .mute { width:100%; margin-top:6px; background:#222631; border:1px solid var(--line); border-radius:10px; padding:10px; }
  button:disabled, input:disabled { opacity:.35; cursor:not-allowed; }
  .link { background:none; border:0; color:var(--accent); padding:0; text-decoration:underline; text-align:left; }
  .sub { margin:8px 4px 0; }
  .field { display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:8px; margin:8px 0; color:var(--dim); font-size:14px; }
  .field input { background:#12151b; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; min-width:0; }
  .small { background:#222631; border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .sheet { position:fixed; inset:0; background:#000b; display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .sheet-box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; width:100%; max-width:420px; max-height:85vh; overflow:auto; }
  .sheet-box h3 { margin:0 0 6px; font-size:18px; }
  #scanHint { margin:0 0 12px; color:var(--dim); font-size:14px; }
  #scanList { display:grid; gap:8px; margin-bottom:12px; }
  .dev { display:flex; justify-content:space-between; align-items:center; text-align:left; background:#222631; border:1px solid var(--line); border-radius:12px; padding:14px; font-size:16px; }
  .dev small { color:var(--ok); font-size:12px; }
  .dev:hover { border-color:var(--accent); }
  .ghost { background:none; border:1px solid var(--line); border-radius:10px; padding:10px; width:100%; }
  footer { margin-top:14px; color:var(--dim); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:10px; display:none; max-width:90vw; text-align:center; }
</style>
</head>
<body>
<main>
  <header>
    <span id="dot" class="dot"></span>
    <span id="statusText">Not connected</span>
    <button id="connectBtn" class="primary">Scan for phones</button>
  </header>
  <div class="sub"><button id="rescanBtn" class="link" hidden>Scan for another phone</button></div>

  <section>
    <h2>Volume</h2>
    <div class="vol"><span>Media</span><input type="range" min="0" max="100" data-cmd="VOL" data-stream="media" disabled><output>–</output></div>
    <div class="vol"><span>Ringtone</span><input type="range" min="0" max="100" data-cmd="VOL" data-stream="ring" disabled><output>–</output></div>
    <div class="vol"><span>Alarm</span><input type="range" min="0" max="100" data-cmd="VOL" data-stream="alarm" disabled><output>–</output></div>
    <button class="mute" data-cmd="MUTE" disabled>Mute / unmute media</button>
  </section>

  <section>
    <h2>Toggles</h2>
    <div class="grid">
      <button class="card" data-cmd="WIFI" data-key="wifi" disabled>Wi-Fi</button>
      <button class="card" data-cmd="LOC" data-key="loc" disabled>Location</button>
      <button class="card" data-cmd="TORCH" data-key="torch" disabled>Flashlight</button>
    </div>
  </section>

  <section>
    <h2>Find my phone</h2>
    <button id="ringBtn" class="ring" data-cmd="RING" data-key="ring" disabled>Ring my phone</button>
  </section>

  <section>
    <h2>Names</h2>
    <label class="field">This controller <input id="nameInput" type="text" maxlength="24"><button id="saveName" class="small">Save</button></label>
    <label class="field">Phone nickname <input id="nickInput" type="text" maxlength="24" placeholder="Connect to a phone first" disabled><button id="saveNick" class="small" disabled>Save</button></label>
    <button id="forgetBtn" class="link">Forget this controller's saved key</button>
  </section>

  <footer>Works in Chrome or Edge over HTTPS (or localhost), and in the PhoneLink desktop app. The phone must be running the PhoneLink service.</footer>
</main>

<div id="scan" class="sheet" hidden>
  <div class="sheet-box">
    <h3>Nearby phones</h3>
    <p id="scanHint">Scanning…</p>
    <div id="scanList"></div>
    <button id="scanCancel" class="ghost">Cancel</button>
  </div>
</div>
<div id="toast"></div>

<script>
const SERVICE = '6e5a0001-7b1c-4f0e-9a52-1c0d5e7a0001';
const CMD     = '6e5a0002-7b1c-4f0e-9a52-1c0d5e7a0001';
const EVT     = '6e5a0003-7b1c-4f0e-9a52-1c0d5e7a0001';
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();

let device = null, cmdChar = null, authed = false, connOnce = false, allowed = new Set();
let buf = '', writeChain = Promise.resolve();
let phone = { id: null, name: '' };
const nicks = JSON.parse(localStorage.getItem('pl_nicks') || '{}');

// ---- identity & key storage (keyed by the unique controller id) ----
function ctrlId() {
  let id = localStorage.getItem('pl_id');
  if (!id) { id = [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('pl_id', id); }
  return id;
}
const cleanName = s => (s || '').replace(/[|\r\n]/g, ' ').trim().slice(0, 24);
const ctrlName = () => cleanName($('nameInput').value) || 'My PC';
const tokKey = () => 'pl_token_' + ctrlId();
$('nameInput').value = localStorage.getItem('pl_name') || 'My PC';

// ---- helpers ----
const hexToBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const bytesToHex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
async function hmacHex(tokenHex, nonceHex) {
  const key = await crypto.subtle.importKey('raw', hexToBytes(tokenHex), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return bytesToHex(new Uint8Array(await crypto.subtle.sign('HMAC', key, hexToBytes(nonceHex))));
}
const phoneLabel = () => (phone.id && nicks[phone.id]) || phone.name || 'phone';

function refreshButtons() {
  const connected = authed || (device && device.gatt && device.gatt.connected);
  $('connectBtn').textContent = connected ? 'Disconnect' : (device ? 'Reconnect' : 'Scan for phones');
  $('rescanBtn').hidden = connected || !device;
}
function setStatus(kind, text) {
  $('dot').className = 'dot ' + kind;
  $('statusText').textContent = text;
  refreshButtons();
}
let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 3000); }
function updateEnabled() {
  document.querySelectorAll('[data-cmd]').forEach(el => { el.disabled = !(authed && allowed.has(el.dataset.cmd)); });
}
function resetPhone() {
  phone = { id: null, name: '' };
  $('nickInput').value = ''; $('nickInput').disabled = true; $('saveNick').disabled = true;
}
function renderConnected() {
  if (!authed) return;
  setStatus('on', 'Connected to ' + phoneLabel() + (connOnce ? ' (this session only)' : ' (trusted)'));
}

// ---- discovery ----
function renderScan(list) {
  const el = $('scanList'); el.innerHTML = '';
  $('scanHint').textContent = list.length
    ? 'Tap a phone to connect.'
    : 'Scanning… make sure the PhoneLink service is running on your phone and it is close by.';
  const last = localStorage.getItem('pl_last_phone') || '';
  list.sort((a, b) => (b.name === last && !!last) - (a.name === last && !!last));
  for (const d of list) {
    const b = document.createElement('button');
    b.className = 'dev';
    const n = document.createElement('span');
    n.textContent = d.name || 'Unnamed phone';       // names come from nearby devices: show as text only
    b.appendChild(n);
    if (last && d.name === last) { const t = document.createElement('small'); t.textContent = 'Last used'; b.appendChild(t); }
    b.addEventListener('click', () => window.plBridge.select(d.id));
    el.appendChild(b);
  }
}
if (window.plBridge) window.plBridge.onDevices(renderScan);
$('scanCancel').addEventListener('click', () => { $('scan').hidden = true; window.plBridge && window.plBridge.select(''); });

async function pickDevice() {
  const opts = { filters: [{ services: [SERVICE] }] };
  if (!window.plBridge) return navigator.bluetooth.requestDevice(opts);   // Chrome/Edge show their own picker
  renderScan([]);
  $('scan').hidden = false;
  try { return await navigator.bluetooth.requestDevice(opts); }
  finally { $('scan').hidden = true; }
}

// ---- BLE ----
function send(line) {
  const bytes = enc.encode(line + '\n');
  writeChain = writeChain.then(async () => {
    for (let i = 0; i < bytes.length; i += 20) {
      const chunk = bytes.slice(i, i + 20);
      await (cmdChar.writeValueWithResponse ? cmdChar.writeValueWithResponse(chunk) : cmdChar.writeValue(chunk));
    }
  }).catch(e => console.warn('write failed', e));
  return writeChain;
}

async function connect(forceScan = false) {
  if (!navigator.bluetooth) { setStatus('', 'Web Bluetooth not supported: use Chrome or Edge'); return; }
  try {
    if (!device || forceScan) {
      if (device) { device.removeEventListener('gattserverdisconnected', onDisconnected); if (device.gatt.connected) device.gatt.disconnect(); }
      device = null; authed = false; allowed = new Set(); updateEnabled(); resetPhone();
      setStatus('wait', 'Scanning for phones…');
      device = await pickDevice();
    }
    device.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus('wait', 'Connecting…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    cmdChar = await svc.getCharacteristic(CMD);
    const evt = await svc.getCharacteristic(EVT);
    evt.addEventListener('characteristicvaluechanged', onNotify);
    await evt.startNotifications();
    buf = ''; authed = false; allowed = new Set(); updateEnabled();
    if (device.name) localStorage.setItem('pl_last_phone', device.name);
    setStatus('wait', 'Contacting phone…');
    await send(`HELLO|${ctrlId()}|${ctrlName()}|pc`);
  } catch (e) {
    if (e.name === 'NotFoundError') { device = null; setStatus('', 'No phone chosen'); }
    else if (e.name === 'InvalidStateError') setStatus('', 'A scan is still finishing: wait a few seconds and try again');
    else setStatus('', 'Connection failed: ' + e.message);
  }
}

function onDisconnected() {
  authed = false; allowed = new Set(); updateEnabled(); resetPhone();
  setStatus('', 'Disconnected');
}

function onNotify(ev) {
  buf += dec.decode(ev.target.value, { stream: true });
  let i;
  while ((i = buf.indexOf('\n')) >= 0) {
    const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
    if (line) handle(line);
  }
}

async function handle(line) {
  const p = line.split('|');
  switch (p[0]) {
    case 'PENDING': setStatus('wait', 'Approve this controller on your phone…'); break;
    case 'CHAL': {
      const tok = localStorage.getItem(tokKey());
      if (!tok) { setStatus('wait', 'Saved key missing: approve again on your phone…'); send(`PAIR|${ctrlId()}|${ctrlName()}|pc`); break; }
      send('AUTH|' + await hmacHex(tok, p[1])); break;
    }
    case 'TOKEN': localStorage.setItem(tokKey(), p[1]); onAuthed(p[2], false); break;
    case 'OK': onAuthed(p[1], p[2] === 'once'); break;
    case 'INFO':
      phone = { id: p[1], name: p.slice(2).join('|') };
      $('nickInput').disabled = false; $('saveNick').disabled = false;
      $('nickInput').value = nicks[phone.id] || phone.name;
      renderConnected(); break;
    case 'STATE': applyState(p[1]); break;
    case 'ERR': onErr(p); break;
  }
}

function onAuthed(csv, once) {
  allowed = new Set((csv || '').split(',').filter(Boolean));
  authed = true; connOnce = !!once; updateEnabled();
  renderConnected();
}

function onErr(p) {
  const why = p[1];
  if (why === 'auth') { localStorage.removeItem(tokKey()); setStatus('wait', 'Key rejected: approve again on your phone…'); send(`PAIR|${ctrlId()}|${ctrlName()}|pc`); }
  else if (why === 'denied' && p[2]) toast('Not allowed for this controller: ' + p[2]);
  else if (why === 'denied') { setStatus('', 'Denied by the phone'); }
  else if (why === 'disabled') setStatus('', "Phone isn't accepting controllers");
  else if (why === 'fail') {
    const names = { LOC: 'Location', VOL: 'Volume', WIFI: 'Wi-Fi', TORCH: 'Flashlight', RING: 'Ring' };
    const n = names[p[2]] || p[2];
    toast(p[3] === 'perm' ? n + ' needs a permission on the phone (open the PhoneLink app for the steps)' : 'Phone could not do: ' + n);
  }
}

// ---- state -> UI ----
function applyState(s) {
  const o = Object.fromEntries(s.split(';').map(kv => kv.split('=')));
  for (const [k, stream] of [['m', 'media'], ['r', 'ring'], ['a', 'alarm']]) {
    const sl = document.querySelector(`input[data-stream="${stream}"]`);
    if (sl && !sl.dataset.drag) { sl.value = o[k]; sl.nextElementSibling.textContent = o[k] + '%'; }
  }
  document.querySelectorAll('[data-key]').forEach(el => {
    const on = o[el.dataset.key] === '1';
    el.classList.remove('pending'); el.classList.toggle('on', on); el.dataset.on = on ? '1' : '0';
  });
  $('ringBtn').textContent = o.ring === '1' ? 'STOP RINGING' : 'Ring my phone';
}

// ---- controls ----
document.querySelectorAll('button[data-cmd]').forEach(el => el.addEventListener('click', () => {
  const cmd = el.dataset.cmd;
  if (cmd === 'MUTE') return send('MUTE');
  const next = el.dataset.on === '1' ? 0 : 1;
  el.classList.add('pending');
  setTimeout(() => el.classList.remove('pending'), 2500);
  send(`${cmd}|${next}`);
}));

document.querySelectorAll('input[data-stream]').forEach(sl => {
  let last = 0;
  const out = sl.nextElementSibling;
  sl.addEventListener('pointerdown', () => sl.dataset.drag = '1');
  const release = () => setTimeout(() => delete sl.dataset.drag, 400);
  sl.addEventListener('pointerup', release); sl.addEventListener('pointercancel', release);
  sl.addEventListener('input', () => {
    out.textContent = sl.value + '%';
    const now = Date.now();
    if (now - last > 120) { last = now; send(`VOL|${sl.dataset.stream}|${sl.value}`); }
  });
  sl.addEventListener('change', () => send(`VOL|${sl.dataset.stream}|${sl.value}`));
});

$('connectBtn').addEventListener('click', () => {
  if (authed || (device && device.gatt.connected)) device.gatt.disconnect(); else connect();
});
$('rescanBtn').addEventListener('click', () => connect(true));

// ---- names ----
$('saveName').addEventListener('click', () => {
  const n = ctrlName();
  localStorage.setItem('pl_name', n); $('nameInput').value = n;
  if (authed) send('NAME|' + n);
  toast('Controller name saved');
});
$('saveNick').addEventListener('click', () => {
  if (!phone.id) { toast('Connect to a phone first'); return; }
  const v = cleanName($('nickInput').value);
  if (v && v !== phone.name) nicks[phone.id] = v; else delete nicks[phone.id];
  localStorage.setItem('pl_nicks', JSON.stringify(nicks));
  renderConnected(); toast('Phone renamed on this PC');
});
$('forgetBtn').addEventListener('click', () => { localStorage.removeItem(tokKey()); toast('Saved key removed'); });

resetPhone(); refreshButtons();
</script>
</body>
</html>
